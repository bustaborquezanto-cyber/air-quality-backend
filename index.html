  <div class="container">
    <h1>💨 Air Watch</h1>
    <div class="card">
      <div class="ppm-value" id="ppm">-- PPM</div>
      <div class="status-box" id="estado">Cargando...</div>
      <p id="ultima-act" style="color: #aaa; font-size: 12px;"></p>
      <button class="btn" onclick="pedirPermiso()">🔔 Activar Alertas en Celular</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDrFnhFaTJ41H2n5l5lVXT8XONJF1m10fo",
      authDomain: "air-watch-2635a.firebaseapp.com",
      databaseURL: "https://air-watch-2635a-default-rtdb.firebaseio.com",
      projectId: "air-watch-2635a",
      storageBucket: "air-watch-2635a.firebasestorage.app",
      messagingSenderId: "295549508237",
      appId: "1:295549508237:web:2fd5297bc7efc58576a0c4"
    };

    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    window.pedirPermiso = async function() {
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          const token = await getToken(messaging, { 
            vapidKey: 'BPw-Vf7Sa174ormC8X5m45MlKr1s97IRIWdznssS8jh5WsL4hXiwd7gRYCHd5-cTLq4nDJb_YRvgaNrjaIpBjps' 
          });
          alert('¡Notificaciones activadas!');
        } else {
          alert('Permiso denegado.');
        }
      } catch (err) {
        console.error('Error al pedir permiso:', err);
      }
    };

    // Consultar datos de la ESP32 enviados al backend
    async function actualizarPantalla() {
      try {
        const res = await fetch('/api/air-quality/current');
        const data = await res.json();
        if (data.success && data.datos) {
          const ppm = data.datos.ppm;
          const estado = data.datos.estado;

          document.getElementById('ppm').innerText = `${ppm} PPM`;
          
          const estadoElem = document.getElementById('estado');
          estadoElem.innerText = estado;
          estadoElem.className = `status-box ${estado.replace(' ', '_')}`;

          document.getElementById('ultima-act').innerText = `Última lectura: ${new Date().toLocaleTimeString()}`;
        }
      } catch (e) {
        console.error("Error obteniendo datos:", e);
      }
    }

    actualizarPantalla();
    setInterval(actualizarPantalla, 3000); // Actualiza cada 3 segundos
  </script>
