<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Watch - Monitoreo de Aire</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: #1e1e1e; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); margin-top: 20px; }
    .status-box { font-size: 24px; font-weight: bold; padding: 15px; border-radius: 10px; margin: 20px 0; background: #333; }
    .ppm-value { font-size: 40px; font-weight: bold; margin: 10px 0; color: #4fc3f7; word-break: break-all; }
    .btn { background: #6200ee; color: #fff; border: none; padding: 14px 24px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; }
    .btn:hover { background: #3700b3; }
    .BUENO { background: #2e7d32; color: #fff; }
    .MODERADO { background: #f9a825; color: #000; }
    .MALO { background: #c62828; color: #fff; }
    .MUY_MALO { background: #6a1b9a; color: #fff; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #252525; border-radius: 8px; overflow: hidden; font-size: 14px; }
    th, td { padding: 10px; text-align: center; border-bottom: 1px solid #333; }
    th { background: #333; color: #4fc3f7; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💨 Air Watch</h1>
    
    <div class="card">
      <div class="ppm-value" id="ppm">-- PPM</div>
      <div class="status-box" id="estado">Cargando...</div>
      <p id="ultima-act" style="color: #aaa; font-size: 12px;"></p>
      <button class="btn" id="btn-alertas">🔔 Activar Alertas en Celular</button>
    </div>

    <div class="card">
      <h3>📜 Historial Reciente</h3>
      <table>
        <thead>
          <tr>
            <th>Hora</th>
            <th>PPM</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="tabla-historial">
          <tr><td colspan="3">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDrFnhFaTJ41H2n5l5lVXT8XONJF1m10fo",
      authDomain: "air-watch-2635a.firebaseapp.com",
      databaseURL: "https://air-watch-2635a-default-rtdb.firebaseio.com",
      projectId: "air-watch-2635a",
      storageBucket: "air-watch-2635a.firebasestorage.app",
      messagingSenderId: "295549508237",
      appId: "1:295549508237:web:2fd5297bc7efc58576a0c4"
    };

    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js').catch(err => console.error('Error SW:', err));
    }

    document.getElementById('btn-alertas').addEventListener('click', async () => {
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          const swReg = await navigator.serviceWorker.ready;
          const token = await getToken(messaging, { 
            vapidKey: 'BPw-Vf7Sa174ormC8X5m45MlKr1s97IRIWdznssS8jh5WsL4hXiwd7gRYCHd5-cTLq4nDJb_YRvgaNrjaIpBjps',
            serviceWorkerRegistration: swReg
          });

          await fetch('/api/subscribe-topic', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token })
          });

          alert('¡Notificaciones activadas y suscrito a las alertas!');
        } else {
          alert('Permiso denegado.');
        }
      } catch (err) {
        console.error('Error al pedir permiso:', err);
      }
    });

    async function actualizarPantalla() {
      try {
        const res = await fetch('/api/air-quality/current');
        const data = await res.json();
        if (data.success && data.datos) {
          const ppm = data.datos.ppm;
          const estado = data.datos.estado;

          // Muestra el número decimal exacto completo
          document.getElementById('ppm').innerText = `${ppm} PPM`;
          
          const estadoElem = document.getElementById('estado');
          estadoElem.innerText = estado;
          estadoElem.className = `status-box ${estado.replace(' ', '_')}`;

          document.getElementById('ultima-act').innerText = `Última lectura: ${new Date().toLocaleTimeString()}`;
        }

        const resHist = await fetch('/api/air-quality/history');
        const dataHist = await resHist.json();
        if (dataHist.success && dataHist.historial) {
          const tbody = document.getElementById('tabla-historial');
          tbody.innerHTML = '';
          
          dataHist.historial.slice(-10).reverse().forEach(item => {
            const hora = new Date(item.timestamp).toLocaleTimeString();
            tbody.innerHTML += `
              <tr>
                <td>${hora}</td>
                <td>${item.ppm}</td>
                <td>${item.estado}</td>
              </tr>
            `;
          });
        }
      } catch (e) {
        console.error("Error obteniendo datos:", e);
      }
    }

    actualizarPantalla();
    setInterval(actualizarPantalla, 3000);
  </script>
</body>
</html>
