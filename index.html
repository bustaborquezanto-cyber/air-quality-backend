<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDrFnhFaTJ41H2n5l5lVXT8XONJF1m10fo",
    authDomain: "air-watch-2635a.firebaseapp.com",
    databaseURL: "https://air-watch-2635a-default-rtdb.firebaseio.com",
    projectId: "air-watch-2635a",
    storageBucket: "air-watch-2635a.firebasestorage.app",
    messagingSenderId: "295549508237",
    appId: "1:295549508237:web:2fd5297bc7efc58576a0c4"
  };

  const app = initializeApp(firebaseConfig);
  const messaging = getMessaging(app);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/firebase-messaging-sw.js')
      .then(reg => console.log('Service Worker registrado:', reg.scope))
      .catch(err => alert('Error registrando SW: ' + err.message));
  }

  document.getElementById('btn-alertas').addEventListener('click', async () => {
    try {
      const permission = await Notification.requestPermission();
      if (permission === 'granted') {
        const swReg = await navigator.serviceWorker.ready;
        const token = await getToken(messaging, { 
          vapidKey: 'BPw-Vf7Sa174ormC8X5m45MlKr1s97IRIWdznssS8jh5WsL4hXiwd7gRYCHd5-cTLq4nDJb_YRvgaNrjaIpBjps',
          serviceWorkerRegistration: swReg
        });

        if (!token) {
          alert('No se pudo generar el token FCM.');
          return;
        }

        const res = await fetch('/api/subscribe-topic', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });

        const data = await res.json();
        if (res.ok) {
          alert('¡Suscrito con éxito a las alertas!');
        } else {
          alert('Error del servidor: ' + JSON.stringify(data));
        }
      } else {
        alert('Permiso de notificaciones denegado.');
      }
    } catch (err) {
      alert('Error en suscripción: ' + err.message);
    }
  });

  async function actualizarPantalla() {
    try {
      const res = await fetch('/api/air-quality/current');
      const data = await res.json();
      if (data.success && data.datos) {
        document.getElementById('ppm').innerText = `${data.datos.ppm} PPM`;
        const estadoElem = document.getElementById('estado');
        estadoElem.innerText = data.datos.estado;
        estadoElem.className = `status-box ${data.datos.estado.replace(' ', '_')}`;
        document.getElementById('ultima-act').innerText = `Última lectura: ${new Date().toLocaleTimeString()}`;
      }

      const resHist = await fetch('/api/air-quality/history');
      const dataHist = await resHist.json();
      if (dataHist.success && dataHist.historial) {
        const tbody = document.getElementById('tabla-historial');
        tbody.innerHTML = '';
        dataHist.historial.slice(-10).reverse().forEach(item => {
          tbody.innerHTML += `
            <tr>
              <td>${new Date(item.timestamp).toLocaleTimeString()}</td>
              <td>${item.ppm}</td>
              <td>${item.estado}</td>
            </tr>
          `;
        });
      }
    } catch (e) {
      console.error("Error obteniendo datos:", e);
    }
  }

  actualizarPantalla();
  setInterval(actualizarPantalla, 3000);
</script>
